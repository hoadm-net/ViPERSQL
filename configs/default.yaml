# ViPERSQL Default Configuration
# ==================================================

# Model Configuration
model:
  name: "gpt-4o-mini"  # Default model, can be overridden by environment variable
  temperature: 0.0
  max_tokens: 1000
  timeout: 30

# Dataset Configuration
dataset:
  level: "std"  # std, syllable, word
  split: "test"  # train, dev, test
  path: "dataset/ViText2SQL"

# Strategy Configuration
strategies:
  few_shot:
    num_examples: 3
    selection_strategy: "random"  # random, skill_knn, dicl, astres, vir2

  vir2:
    candidate_pool_size: 50  # M parameter
    beam_size: 5            # B parameter
    diversity_weight: 0.3   # λ parameter

# Evaluation Configuration
evaluation:
  enhanced_metrics: true
  component_analysis: true
  error_analysis: true
  difficulty_analysis: true

# Output Configuration
output:
  results_dir: "results"
  intermediate_save_interval: 10
  include_timestamps: true

# System Configuration
system:
  preview_length:
    question: 50
    sql: 100
  separator_length: 60
  long_separator_length: 80
